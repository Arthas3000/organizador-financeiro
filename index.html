<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="bloqueio" id="bloqueio" role="dialog" aria-modal="true" aria-labelledby="bloqueio-tit">
  <img src="./icon-180.png" alt="" width="72" height="72">
  <h1 id="bloqueio-tit">Finanças bloqueado</h1>
  <p id="bloqueio-msg" role="status"></p>
  <button id="desbloquear" hidden>Desbloquear com Face ID</button>
</div>
<main>
  <section class="tela on" id="inicio"></section>
  <section class="tela" id="extrato"></section>
  <section class="tela" id="analise"></section>
  <section class="tela" id="mais"></section>
</main>

<button class="fab" id="fab" aria-label="Novo lançamento">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" id="tabs" aria-label="Principal" style="--i:0">
  <i class="ind" aria-hidden="true"></i>
  <button data-aba="inicio" aria-label="Início" aria-current="page">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><span>Início</span>
  </button>
  <button data-aba="extrato" aria-label="Extrato">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Extrato</span>
  </button>
  <button data-aba="analise" aria-label="Análise">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V12M12 20V5M19 20v-5"/></svg><span>Análise</span>
  </button>
  <button data-aba="mais" aria-label="Mais">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg><span>Mais</span>
  </button>
</nav>

<script type="module" src="./js/bloqueio.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
